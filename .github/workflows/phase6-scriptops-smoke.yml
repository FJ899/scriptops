name: Phase 6 ScriptOps smoke

on:
  pull_request:
    paths:
      - 'README.md'
      - 'PROJECT_STATE.md'
      - 'HANDOFF.md'
      - 'CODEX_START.md'
      - 'scripts/verify_repository.py'
      - 'legacy/scriptops-v2-single.py'
      - 'phase6/**'
      - 'tests/test_phase6_*.py'
      - '.github/workflows/phase6-scriptops-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing ScriptOps v2 dependency
        run: python -m pip install pyyaml
      - name: Compile Phase 6 path
        run: python -m compileall -q phase6 scripts/verify_repository.py tests/test_phase6_scriptops_smoke.py
      - name: Run repository semantic/currentness verifier
        run: python scripts/verify_repository.py
      - name: Run full deterministic Phase 6 regression
        run: python -m unittest discover -s tests -p 'test_phase6_*.py' -v
